name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: cli
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run check
