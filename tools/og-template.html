<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;background:#f6f7f5;color:#16181b;
  font-family:"IBM Plex Sans",sans-serif;padding:64px 72px;
  display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:12px;padding-bottom:22px;border-bottom:1px solid #d2d5cf}
.mk{width:44px;height:26px;background:currentColor;-webkit-mask:url(/assets/mark.svg) center/contain no-repeat}
.wd{font-weight:600;font-size:27px}
h1{margin:0;font-size:66px;line-height:1.03;letter-spacing:-.024em;font-weight:600;max-width:21ch}
.rows{font-size:19px;color:#5a6067;border-top:1px solid #d2d5cf}
.rows div{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:9px 0;border-bottom:1px solid #d2d5cf}
.rows b{font-weight:400;font-family:"IBM Plex Mono",monospace;font-size:17px}
</style></head><body>
<div class="top"><div class="mk"></div><div class="wd">Hedgerouter</div></div>
<h1>Your AI budget floats on a market you don't control.</h1>
<div class="rows">
  <div><b>exposure</b><span>your AI spend, in dollars, by model and provider</span></div>
  <div><b>basis</b><span>how much of that cost line an instrument actually tracks</span></div>
</div>
</body></html>
